[package]
name = "afudm-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
afudm-types.workspace = true
afudm-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
subtle = "2"
url = "2"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Networking_WinSock"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
afudm-db = { path = "../afudm-db" }
