<svg xmlns="http://www.w3.org/2000/svg" width="960" height="809" viewBox="0 0 960 809" role="img" aria-labelledby="title desc">
<title id="title">AfuDM features</title><desc id="desc">Twelve features verified against the Rust desktop app and browser extension.</desc>
<defs><style>
:root{--bg:#f6f8fc;--surface:#fff;--line:#cdd7e6;--text:#182435;--muted:#4e6078;--blue:#245fb5;--green:#16784d;--purple:#7042ad}
@media(prefers-color-scheme:dark){:root{--bg:#14181f;--surface:#1c222c;--line:#2a3340;--text:#e6eaf0;--muted:#8a97a8;--blue:#5b9dff;--green:#46c98b;--purple:#a78bfa}}
text{font-family:"Segoe UI",sans-serif;fill:var(--text)}
.bg{fill:var(--bg)} .card{fill:var(--surface);stroke:var(--line)}
.muted{fill:var(--muted)} .blue{fill:var(--blue)} .green{fill:var(--green)} .purple{fill:var(--purple)}
.line{stroke:var(--line);fill:none;stroke-width:2}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px}
.title{font-size:29px;font-weight:700;letter-spacing:-.5px}
.body{font-size:16px}.small{font-size:13px}
.pulse{animation:pulse 4s ease-in-out infinite}
.packet{animation:travel 4s linear infinite}
.bar{transform-box:fill-box;transform-origin:left;animation:fillup 5s ease-in-out infinite}
.focus{animation:focus 5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes travel{0%{stroke-dashoffset:90}100%{stroke-dashoffset:0}}
@keyframes fillup{0%,100%{transform:scaleX(.22)}65%,85%{transform:scaleX(1)}}
@keyframes focus{0%,100%{stroke:var(--line)}45%,70%{stroke:var(--blue)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style><linearGradient id="accent"><stop stop-color="#5b9dff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
<rect x="1" y="1" width="958" height="807" rx="16" class="bg" /><text x="32" y="43" class="eyebrow muted" >ONE QUEUE. MORE POSSIBILITIES.</text><text x="32" y="85" class="title" >Built for the way you download.</text><rect x="32" y="114" width="288" height="143" rx="16" class="card" /><g transform="translate(48 129)" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h22M2 13h22M2 21h22M8 2v6M17 10v6M11 18v6"/></g><circle cx="295" cy="142" r="4" class="pulse blue" style="animation-delay:-0.0s"/><text x="48" y="183" class="" font-size="18" font-weight="650">Parallel downloads</text><text x="48" y="212" class="small muted" >File parts download together.</text><text x="48" y="233" class="small muted" >Powered by aria2.</text><rect x="336" y="114" width="288" height="143" rx="16" class="card" /><g transform="translate(352 129)" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v21M14 3v21M21 4l8 9-8 9"/></g><circle cx="599" cy="142" r="4" class="pulse purple" style="animation-delay:-0.23s"/><text x="352" y="183" class="" font-size="18" font-weight="650">Pause &amp; resume</text><text x="352" y="212" class="small muted" >Continue supported downloads.</text><text x="352" y="233" class="small muted" >Keep one shared queue.</text><rect x="640" y="114" width="288" height="143" rx="16" class="card" /><g transform="translate(656 129)" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2v15m-7-7 7 7 7-7M3 20v6h20v-6"/></g><circle cx="903" cy="142" r="4" class="pulse green" style="animation-delay:-0.46s"/><text x="656" y="183" class="" font-size="18" font-weight="650">Torrents &amp; magnets</text><text x="656" y="212" class="small muted" >Add a magnet or .torrent file.</text><text x="656" y="233" class="small muted" >Follow peers and progress.</text><rect x="32" y="273" width="288" height="143" rx="16" class="card" /><g transform="translate(48 288)" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h22v20H3zM11 9l8 5-8 5z"/></g><circle cx="295" cy="301" r="4" class="pulse blue" style="animation-delay:-0.6900000000000001s"/><text x="48" y="342" class="" font-size="18" font-weight="650">Video when you need it</text><text x="48" y="371" class="small muted" >Optional yt-dlp and FFmpeg.</text><text x="48" y="392" class="small muted" >Supported sites vary.</text><rect x="336" y="273" width="288" height="143" rx="16" class="card" /><g transform="translate(352 288)" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h24v21H2zM2 10h24M7 7h1m3 0h1M9 17h11m-5-4 5 4-5 4"/></g><circle cx="599" cy="301" r="4" class="pulse purple" style="animation-delay:-0.92s"/><text x="352" y="342" class="" font-size="18" font-weight="650">Browser capture</text><text x="352" y="371" class="small muted" >Extension handoff + fallback.</text><text x="352" y="392" class="small muted" >A second path when needed.</text><rect x="640" y="273" width="288" height="143" rx="16" class="card" /><g transform="translate(656 288)" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 11a11 11 0 1 0-1 11M24 3v9h-9"/></g><circle cx="903" cy="301" r="4" class="pulse green" style="animation-delay:-1.1500000000000001s"/><text x="656" y="342" class="" font-size="18" font-weight="650">A second try after 403</text><text x="656" y="371" class="small muted" >Retry with browser-style headers.</text><text x="656" y="392" class="small muted" >Once, for eligible file requests.</text><rect x="32" y="432" width="288" height="143" rx="16" class="card" /><g transform="translate(48 447)" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2 25 7v9c0 7-11 12-11 12S3 23 3 16V7zM8 14l4 4 9-9"/></g><circle cx="295" cy="460" r="4" class="pulse blue" style="animation-delay:-1.3800000000000001s"/><text x="48" y="501" class="" font-size="18" font-weight="650">Catch error pages</text><text x="48" y="530" class="small muted" >Detect HTML posing as a file.</text><text x="48" y="551" class="small muted" >Check supplied SHA-256 too.</text><rect x="336" y="432" width="288" height="143" rx="16" class="card" /><g transform="translate(352 447)" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a11 11 0 0 1 20-3m0-5v6h-6M24 18A11 11 0 0 1 4 21m0 5v-6h6"/></g><circle cx="599" cy="460" r="4" class="pulse purple" style="animation-delay:-1.61s"/><text x="352" y="501" class="" font-size="18" font-weight="650">Automatic updates</text><text x="352" y="530" class="small muted" >Check and download new releases.</text><text x="352" y="551" class="small muted" >Apply when downloads are idle.</text><rect x="640" y="432" width="288" height="143" rx="16" class="card" /><g transform="translate(656 447)" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7V4h10l4 4h11v17H2z"/></g><circle cx="903" cy="460" r="4" class="pulse green" style="animation-delay:-1.84s"/><text x="656" y="501" class="" font-size="18" font-weight="650">Take your app with you</text><text x="656" y="530" class="small muted" >Extract the ZIP. Open AfuDM.exe.</text><text x="656" y="551" class="small muted" >Keep companion folders together.</text><rect x="32" y="591" width="288" height="143" rx="16" class="card" /><g transform="translate(48 606)" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2h15v26H7zM12 23h5M11 7h7v8h-7z"/></g><circle cx="295" cy="619" r="4" class="pulse blue" style="animation-delay:-2.0700000000000003s"/><text x="48" y="660" class="" font-size="18" font-weight="650">Phone pairing</text><text x="48" y="689" class="small muted" >Scan the local pairing QR.</text><text x="48" y="710" class="small muted" >Manage and transfer files.</text><rect x="336" y="591" width="288" height="143" rx="16" class="card" /><g transform="translate(352 606)" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3A12 12 0 1 0 26 21 13 13 0 0 1 22 3"/></g><circle cx="599" cy="619" r="4" class="pulse purple" style="animation-delay:-2.3000000000000003s"/><text x="352" y="660" class="" font-size="18" font-weight="650">Quiet when idle</text><text x="352" y="689" class="small muted" >Save the session, stop aria2.</text><text x="352" y="710" class="small muted" >Wake it for the next download.</text><rect x="640" y="591" width="288" height="143" rx="16" class="card" /><g transform="translate(656 606)" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h16M10 2v3M6 5c1 9 9 15 13 16M15 5C13 15 7 19 2 21M18 26l6-15 6 15M20 22h8"/></g><circle cx="903" cy="619" r="4" class="pulse green" style="animation-delay:-2.5300000000000002s"/><text x="656" y="660" class="" font-size="18" font-weight="650">English &amp; Türkçe</text><text x="656" y="689" class="small muted" >Use the language you prefer.</text><text x="656" y="710" class="small muted" >Choose it inside the app.</text><text x="32" y="782" class="body muted" >Optional engines and automation stay out of the way until you need them.</text></svg>
