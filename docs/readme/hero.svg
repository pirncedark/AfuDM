<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">AfuDM</title><desc id="desc">Files, videos and torrents in one portable Windows app. Animated bars are illustrative, not benchmark results.</desc>
<defs><style>
:root{--bg:#f6f8fc;--surface:#fff;--line:#cdd7e6;--text:#182435;--muted:#4e6078;--blue:#245fb5;--green:#16784d;--purple:#7042ad}
@media(prefers-color-scheme:dark){:root{--bg:#14181f;--surface:#1c222c;--line:#2a3340;--text:#e6eaf0;--muted:#8a97a8;--blue:#5b9dff;--green:#46c98b;--purple:#a78bfa}}
text{font-family:"Segoe UI",sans-serif;fill:var(--text)}
.bg{fill:var(--bg)} .card{fill:var(--surface);stroke:var(--line)}
.muted{fill:var(--muted)} .blue{fill:var(--blue)} .green{fill:var(--green)} .purple{fill:var(--purple)}
.line{stroke:var(--line);fill:none;stroke-width:2}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px}
.title{font-size:29px;font-weight:700;letter-spacing:-.5px}
.body{font-size:16px}.small{font-size:13px}
.pulse{animation:pulse 4s ease-in-out infinite}
.packet{animation:travel 4s linear infinite}
.bar{transform-box:fill-box;transform-origin:left;animation:fillup 5s ease-in-out infinite}
.focus{animation:focus 5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes travel{0%{stroke-dashoffset:90}100%{stroke-dashoffset:0}}
@keyframes fillup{0%,100%{transform:scaleX(.22)}65%,85%{transform:scaleX(1)}}
@keyframes focus{0%,100%{stroke:var(--line)}45%,70%{stroke:var(--blue)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style><linearGradient id="accent"><stop stop-color="#5b9dff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
<rect x="1" y="1" width="958" height="348" rx="16" class="bg" /><text x="40" y="45" class="eyebrow muted" >THE PORTABLE DOWNLOAD MANAGER</text><image x="40" y="76" width="78" height="78" href="data:image/png;base64,"/><text x="138" y="138" class="" font-size="70" font-weight="750" letter-spacing="-3">AfuDM</text><text x="40" y="197" class="" font-size="31" font-weight="600">Files. Videos. Torrents. One app.</text><text x="40" y="230" class="body muted" >Open a link. Pick your folder. Let AfuDM take it from there.</text><text x="40" y="294" class="eyebrow muted" >RUST + TAURI   /   WINDOWS   /   OPEN SOURCE</text><rect x="635" y="74" width="283" height="57" rx="16" class="card" /><text x="653" y="97" class="eyebrow blue" >FILES</text><rect x="653" y="110" width="245" height="5" rx="2" fill="var(--line)"/><rect x="653" y="110" width="245" height="5" rx="2" class="bar blue" style="animation-delay:-0.0s"/><rect x="635" y="147" width="283" height="57" rx="16" class="card" /><text x="653" y="170" class="eyebrow green" >VIDEO</text><rect x="653" y="183" width="245" height="5" rx="2" fill="var(--line)"/><rect x="653" y="183" width="245" height="5" rx="2" class="bar green" style="animation-delay:-0.7s"/><rect x="635" y="220" width="283" height="57" rx="16" class="card" /><text x="653" y="243" class="eyebrow purple" >TORRENTS</text><rect x="653" y="256" width="245" height="5" rx="2" fill="var(--line)"/><rect x="653" y="256" width="245" height="5" rx="2" class="bar purple" style="animation-delay:-1.4s"/><path d="M40 326H920" stroke="url(#accent)" stroke-width="3" class="pulse"/></svg>
