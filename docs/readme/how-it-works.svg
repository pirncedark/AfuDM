<svg xmlns="http://www.w3.org/2000/svg" width="960" height="554" viewBox="0 0 960 554" role="img" aria-labelledby="title desc">
<title id="title">How AfuDM works</title><desc id="desc">Browser to AfuDM to aria2 to download checks to the destination folder. QR pairing and optional automation.</desc>
<defs><style>
:root{--bg:#f6f8fc;--surface:#fff;--line:#cdd7e6;--text:#182435;--muted:#4e6078;--blue:#245fb5;--green:#16784d;--purple:#7042ad}
@media(prefers-color-scheme:dark){:root{--bg:#14181f;--surface:#1c222c;--line:#2a3340;--text:#e6eaf0;--muted:#8a97a8;--blue:#5b9dff;--green:#46c98b;--purple:#a78bfa}}
text{font-family:"Segoe UI",sans-serif;fill:var(--text)}
.bg{fill:var(--bg)} .card{fill:var(--surface);stroke:var(--line)}
.muted{fill:var(--muted)} .blue{fill:var(--blue)} .green{fill:var(--green)} .purple{fill:var(--purple)}
.line{stroke:var(--line);fill:none;stroke-width:2}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px}
.title{font-size:29px;font-weight:700;letter-spacing:-.5px}
.body{font-size:16px}.small{font-size:13px}
.pulse{animation:pulse 4s ease-in-out infinite}
.packet{animation:travel 4s linear infinite}
.bar{transform-box:fill-box;transform-origin:left;animation:fillup 5s ease-in-out infinite}
.focus{animation:focus 5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes travel{0%{stroke-dashoffset:90}100%{stroke-dashoffset:0}}
@keyframes fillup{0%,100%{transform:scaleX(.22)}65%,85%{transform:scaleX(1)}}
@keyframes focus{0%,100%{stroke:var(--line)}45%,70%{stroke:var(--blue)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style><linearGradient id="accent"><stop stop-color="#5b9dff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
<rect x="1" y="1" width="958" height="552" rx="16" class="bg" /><text x="32" y="43" class="eyebrow muted" >FROM CLICK TO COMPLETED</text><text x="32" y="85" class="title" >Your download, handled.</text><rect x="32" y="120" width="164" height="225" rx="16" class="card focus" style="animation-delay:-0.0s"/><text x="48" y="148" class="eyebrow muted" >01</text><g transform="translate(48 169)" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h24v21H2zM2 10h24M7 7h1m3 0h1M9 17h11m-5-4 5 4-5 4"/></g><text x="48" y="226" class="" font-size="21" font-weight="650">Browser</text><text x="48" y="256" class="small muted" >Click a link</text><text x="48" y="277" class="small muted" >Extension capture</text><path d="M200 232h12m-4-4 4 4-4 4" stroke="var(--blue)" fill="none" stroke-width="2"/><rect x="215" y="120" width="164" height="225" rx="16" class="card focus" style="animation-delay:-0.7s"/><text x="231" y="148" class="eyebrow muted" >02</text><g transform="translate(231 169)" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7V4h10l4 4h11v17H2z"/></g><text x="231" y="226" class="" font-size="21" font-weight="650">AfuDM</text><text x="231" y="256" class="small muted" >One shared queue</text><text x="231" y="277" class="small muted" >Browser fallback</text><path d="M383 232h12m-4-4 4 4-4 4" stroke="var(--blue)" fill="none" stroke-width="2"/><rect x="398" y="120" width="164" height="225" rx="16" class="card focus" style="animation-delay:-1.4s"/><text x="414" y="148" class="eyebrow muted" >03</text><g transform="translate(414 169)" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h22M2 13h22M2 21h22M8 2v6M17 10v6M11 18v6"/></g><text x="414" y="226" class="" font-size="21" font-weight="650">Download</text><text x="414" y="256" class="small muted" >aria2 file segments</text><text x="414" y="277" class="small muted" >Parallel connections</text><path d="M566 232h12m-4-4 4 4-4 4" stroke="var(--blue)" fill="none" stroke-width="2"/><rect x="414" y="309" width="27" height="7" rx="2" class="bar blue" style="animation-delay:-0.0s"/><rect x="448" y="309" width="27" height="7" rx="2" class="bar blue" style="animation-delay:-0.6s"/><rect x="482" y="309" width="27" height="7" rx="2" class="bar blue" style="animation-delay:-1.2s"/><rect x="516" y="309" width="27" height="7" rx="2" class="bar blue" style="animation-delay:-1.7999999999999998s"/><rect x="581" y="120" width="164" height="225" rx="16" class="card focus" style="animation-delay:-2.0999999999999996s"/><text x="597" y="148" class="eyebrow muted" >04</text><g transform="translate(597 169)" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2 25 7v9c0 7-11 12-11 12S3 23 3 16V7zM8 14l4 4 9-9"/></g><text x="597" y="226" class="" font-size="21" font-weight="650">Check</text><text x="597" y="256" class="small muted" >Detect error pages</text><text x="597" y="277" class="small muted" >SHA-256 if supplied</text><path d="M749 232h12m-4-4 4 4-4 4" stroke="var(--blue)" fill="none" stroke-width="2"/><rect x="764" y="120" width="164" height="225" rx="16" class="card focus" style="animation-delay:-2.8s"/><text x="780" y="148" class="eyebrow muted" >05</text><g transform="translate(780 169)" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7V4h10l4 4h11v17H2z"/></g><text x="780" y="226" class="" font-size="21" font-weight="650">Finish</text><text x="780" y="256" class="small muted" >Save to your folder</text><text x="780" y="277" class="small muted" >Optional automation</text><path d="M48 371H912" stroke="var(--blue)" stroke-width="3" stroke-dasharray="8 22" class="packet"/><rect x="32" y="396" width="438" height="100" rx="16" class="card" /><g transform="translate(50 418)" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2h15v26H7zM12 23h5M11 7h7v8h-7z"/></g><text x="95" y="431" class="body" font-weight="650">Pair your phone</text><text x="95" y="457" class="body muted" >Scan the QR • same local network</text><rect x="490" y="396" width="438" height="100" rx="16" class="card" /><g transform="translate(508 418)" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2 25 7v9c0 7-11 12-11 12S3 23 3 16V7zM8 14l4 4 9-9"/></g><text x="552" y="431" class="body" font-weight="650">Finish your way</text><text x="552" y="457" class="body muted" >Optional ZIP extraction, move, notification</text><text x="32" y="531" class="small muted" >Illustrated flow • Actions and checksum verification depend on your settings.</text></svg>
