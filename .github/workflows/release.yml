name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml
    permissions:
      actions: read
      contents: read

  gate:
    needs: quality-gate
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: TEMEL GATE - tag + surum.py + origin/main HEAD ayni olmali
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:REF_NAME
          $surum = & python scripts\surum_oku.py
          Write-Host "tag: $tag   surum.py: $surum"
          if ($tag -ne "v$surum") {
            Write-Host "GATE HATA: beklenen: v$surum, gelen: $tag"
            exit 1
          }
          git fetch origin main
          $head = git rev-parse HEAD
          $mainHead = git rev-parse origin/main
          if ($head -ne $mainHead) {
            Write-Host "GATE HATA: tag, origin/main HEAD'inde degil (head=$head main=$mainHead)"
            exit 1
          }
          Write-Host "gate OK"

  build:
    runs-on: windows-latest
    needs: gate
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Cevrimdisi kutuphaneler
        run: python -m pip install --quiet pywebview pystray pillow qrcode pyinstaller playwright

      - name: Cevrimdisi testler
        run: powershell -ExecutionPolicy Bypass -File scripts/test.ps1

      - name: Motorlari indir
        run: python -c "from core import engines; engines.indir('aria2c')"

      - name: PyInstaller ile EXE derle
        run: python -m PyInstaller --noconfirm --clean AfuDM.spec

      - name: Surum kapisi + paket
        shell: pwsh
        run: |
          $surum = & python scripts\surum_oku.py
          powershell -ExecutionPolicy Bypass -File scripts\build_release.ps1 -Tag "v$surum"

      - name: Zip + dogrulama + duman + checksum
        shell: pwsh
        run: |
          $surum = & python scripts\surum_oku.py
          $zip = "build_out\AfuDM-v$surum-win64.zip"
          Compress-Archive -Path build_out\paket\AfuDM -DestinationPath $zip -Force
          powershell -ExecutionPolicy Bypass -File scripts\verify_release.ps1 $zip
          if ($LASTEXITCODE -ne 0) { throw "verify_release basarisiz ($LASTEXITCODE)" }
          powershell -ExecutionPolicy Bypass -File scripts\smoke_test.ps1 $zip
          if ($LASTEXITCODE -ne 0) { throw "smoke_test basarisiz ($LASTEXITCODE)" }
          powershell -ExecutionPolicy Bypass -File scripts\make_checksums.ps1 $zip
          if ($LASTEXITCODE -ne 0) { throw "make_checksums basarisiz ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: afudm-release
          path: |
            build_out/AfuDM-v*-win64.zip
            build_out/*.sha256
          if-no-files-found: error

      - name: Not dosyasina SHA-256 ekle
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $surum = & python scripts\surum_oku.py
          $zip = (Resolve-Path "build_out\AfuDM-v$surum-win64.zip").Path
          $not = "docs/RELEASE_NOTES/$env:REF_NAME.md"
          if (-not (Test-Path (Split-Path $not) -PathType Container)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $not) | Out-Null
          }
          if (-not (Test-Path $not -PathType Leaf)) {
            Write-Host "UYARI: $not yok — olusturuluyor"
            "# $env:REF_NAME" | Set-Content -Path $not -Encoding UTF8
          }
          $zipHash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash
          $exe = "build_out\paket\AfuDM\AfuDM.exe"
          $exeHash = if (Test-Path $exe) { (Get-FileHash -Algorithm SHA256 -Path $exe).Hash } else { "yok" }
          $tabloSatirlar = @(
            "| Dosya | SHA-256 |",
            "|---|---|",
            "| $([IO.Path]::GetFileName($zip)) | $zipHash |",
            "| AfuDM.exe | $exeHash |"
          )
          $icerik = Get-Content -Path $not -Raw
          $placeholder = '<!-- SHA256-PLACEHOLDER -->'
          if ($icerik.Contains($placeholder)) {
            $nl = if ($icerik.Contains("`r`n")) { "`r`n" } else { "`n" }
            $icerik.Replace($placeholder, ($tabloSatirlar -join $nl)) | Set-Content -Path $not -Encoding utf8 -NoNewline
            Write-Host "SHA-256 placeholder guncellendi: $not"
          } else {
            $bolum = @("", "## SHA-256") + $tabloSatirlar
            Add-Content -Path $not -Value $bolum -Encoding utf8
            Write-Host "SHA-256 eklendi: $not"
          }

      - name: Release basligini nottan oku
        id: release_basligi
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $not = "docs/RELEASE_NOTES/$env:REF_NAME.md"
          $baslik = "AfuDM $env:REF_NAME"
          if (Test-Path $not -PathType Leaf) {
            $satir = Get-Content -Path $not | Where-Object { $_ -match '^#\s+' } | Select-Object -First 1
            if (-not [string]::IsNullOrWhiteSpace($satir)) {
              $aday = $satir -replace '^#\s+', ''
              if (-not [string]::IsNullOrWhiteSpace($aday)) {
                $baslik = $aday.Trim()
              }
            }
          }
          "baslik=$baslik" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Yer tutucu kapisi (SHA-256 dolduruldu mu)
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $not = "docs/RELEASE_NOTES/$env:REF_NAME.md"
          if (-not (Test-Path $not -PathType Leaf)) {
            Write-Host "GATE HATA - surum notu yok: $not"; exit 1
          }
          if ((Get-Content -Path $not -Raw).Contains('<!-- SHA256-PLACEHOLDER -->')) {
            Write-Host "GATE HATA - yer tutucu HALA dolu degil: $not"; exit 1
          }
          Write-Host "yer tutucu dolduruldu: $not"

      - name: Github Release yayinla
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ steps.release_basligi.outputs.baslik }}
          files: |
            build_out/AfuDM-v*-win64.zip
            build_out/*.sha256
          body_path: docs/RELEASE_NOTES/${{ github.ref_name }}.md
