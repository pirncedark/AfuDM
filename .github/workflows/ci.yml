name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:

jobs:
  parse:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Sozdizimi kapisi
        run: powershell -ExecutionPolicy Bypass -File scripts/test.ps1 -ParseOnly

  offline:
    runs-on: windows-latest
    needs: parse
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Cevrimdisi kutuphaneler
        run: python -m pip install --quiet pywebview pystray pillow qrcode playwright
      - name: Cevrimdisi testler (ag gerektirmez)
        run: powershell -ExecutionPolicy Bypass -File scripts/test.ps1

  build:
    runs-on: windows-latest
    needs: offline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Motorlari indir
        run: python -c "from core import engines; engines.indir('aria2c')"
      - name: Paket
        run: |
          python -m pip install --quiet pyinstaller
          powershell -ExecutionPolicy Bypass -File scripts/build_release.ps1
      - name: Zip + dogrulama + checksum
        shell: pwsh
        run: |
          $surum = & python scripts\surum_oku.py
          $zip = "build_out\AfuDM-v$surum-win64.zip"
          Compress-Archive -Path build_out\paket\AfuDM -DestinationPath $zip -Force
          powershell -ExecutionPolicy Bypass -File scripts\verify_release.ps1 $zip
          powershell -ExecutionPolicy Bypass -File scripts\make_checksums.ps1 $zip
      - uses: actions/upload-artifact@v7
        with:
          name: afudm-ci-package
          path: |
            build_out/AfuDM-v*-win64.zip
            build_out/*.sha256
          if-no-files-found: error