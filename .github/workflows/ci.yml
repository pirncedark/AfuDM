name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust fmt, test, clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Sabit Rust arac zinciri
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.98.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: aria2c motorunu indir
        run: python scripts/aria2_indir.py
      - name: Rust kapilari (iki workspace)
        env:
          AFUDM_ARIA2_TEST_EXE: ${{ github.workspace }}/engine/aria2c.exe
        shell: pwsh
        run: |
          foreach ($manifest in @("rs/Cargo.toml", "rs/app/Cargo.toml")) {
            cargo fmt --manifest-path $manifest --all -- --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked --manifest-path $manifest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo clippy --locked --manifest-path $manifest --all-targets -- -D warnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
