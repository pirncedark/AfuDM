name: Kalite

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kalite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kalite:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: python -m pip install --quiet pre-commit
      # Yalniz bu PR/push ile degisen dosyalar; tum depo temizligi ayri style PR'inda.
      - name: Run pre-commit hooks on changed files
        shell: bash
        env:
          SKIP: zizmor
          FROM_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pre-commit run --from-ref "$FROM_REF" --to-ref HEAD --show-diff-on-failure
      # AfuDM yalniz Windows uygulamasi (core/windows_integration.py winreg ister).
      - name: Run offline tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/pre_push_test.ps1
