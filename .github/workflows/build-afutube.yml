name: Build AfuTube (Native Android)

on:
  push:
    paths:
      - 'AfuTube/**'
      - '.github/workflows/build-afutube.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Gradle & Generate Wrapper
        working-directory: ./AfuTube
        run: |
          # Gradle'i SDK Manager olmadan doğrudan kur
          GRADLE_VERSION="9.6.0"
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          export GRADLE_HOME="/tmp/gradle-${GRADLE_VERSION}"
          export PATH="$GRADLE_HOME/bin:$PATH"
          gradle wrapper --gradle-version ${GRADLE_VERSION} --distribution-type bin
          chmod +x gradlew

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run AfuTube unit tests
        working-directory: ./AfuTube
        run: ./gradlew test --no-daemon --stacktrace

      - name: Prepare release keystore
        shell: bash
        env:
          AFUTUBE_KEYSTORE_B64: ${{ secrets.AFUTUBE_KEYSTORE_B64 }}
        run: echo "$AFUTUBE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/afutube-release.jks"

      - name: Build signed universal release APK
        working-directory: ./AfuTube
        env:
          AFUTUBE_KEYSTORE_PATH: ${{ runner.temp }}/afutube-release.jks
          AFUTUBE_KEYSTORE_PASS: ${{ secrets.AFUTUBE_KEYSTORE_PASS }}
          AFUTUBE_KEY_ALIAS: ${{ secrets.AFUTUBE_KEY_ALIAS }}
          AFUTUBE_KEY_PASS: ${{ secrets.AFUTUBE_KEY_PASS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }} -PversionName=0.0.${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: AfuTube-Release-APK
          path: AfuTube/app/build/outputs/apk/release/*universal*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload all ABI APKs for emulator test
        uses: actions/upload-artifact@v7
        with:
          name: AfuTube-All-APKs
          path: AfuTube/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-logs
          path: |
            AfuTube/app/build/reports/
            AfuTube/build/reports/
          retention-days: 7

  # "HAZIR" demeden once: uygulama emulatorde AG KAPALIYKEN acilip ana ekrani gostermeli.
  e2e-acilis:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: AfuTube-All-APKs
          path: apks

      - name: Pick APK for x86_64 emulator
        run: |
          ls -la apks
          APK=$(ls apks/*x86_64*.apk 2>/dev/null | head -1)
          if [ -n "$APK" ] && unzip -l "$APK" | grep -q 'lib/x86_64/'; then
            echo "x86_64 native kutuphaneli APK: $APK"
          else
            APK=$(ls apks/*universal*.apk | head -1)
            echo "x86_64 split yok/bos; universal (ARM ceviri ile): $APK"
          fi
          cp "$APK" apks/secilen.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare browser capture fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl --fail --location --retry 3 https://www.w3schools.com/html/mov_bbb.mp4 -o AfuTube/scripts/e2e-site/clip.mp4
          mkdir -p AfuTube/scripts/e2e-site/hls/720p
          ffmpeg -hide_banner -loglevel error -y -i AfuTube/scripts/e2e-site/clip.mp4 -an -c:v libx264 -preset ultrafast -vf scale=-2:360 -hls_time 4 -hls_playlist_type vod -hls_segment_filename AfuTube/scripts/e2e-site/hls/720p/segment%03d.ts AfuTube/scripts/e2e-site/hls/720p/index.m3u8
          printf '#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-STREAM-INF:BANDWIDTH=800000,RESOLUTION=640x360\n720p/index.m3u8\n' > AfuTube/scripts/e2e-site/hls/master.m3u8

      - name: Offline startup + download smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            python3 AfuTube/scripts/e2e-site/server.py > /tmp/afutube-e2e-server.log 2>&1 &
            sleep 2
            bash AfuTube/scripts/e2e-acilis.sh apks/secilen.apk
            bash AfuTube/scripts/e2e-indirme.sh
            bash AfuTube/scripts/e2e-paylas.sh
            bash AfuTube/scripts/e2e-sade.sh
            bash AfuTube/scripts/e2e-tarayici.sh

      - name: Upload e2e evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AfuTube-e2e-acilis
          path: e2e-out/
          retention-days: 14
