name: Build AfuTube (Native Android)

on:
  push:
    paths:
      - 'AfuTube/**'
      - '.github/workflows/build-afutube.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Gradle & Generate Wrapper
        working-directory: ./AfuTube
        run: |
          # Gradle'i SDK Manager olmadan doğrudan kur
          GRADLE_VERSION="9.6.0"
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          export GRADLE_HOME="/tmp/gradle-${GRADLE_VERSION}"
          export PATH="$GRADLE_HOME/bin:$PATH"
          gradle wrapper --gradle-version ${GRADLE_VERSION} --distribution-type bin
          chmod +x gradlew

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run AfuTube unit tests
        working-directory: ./AfuTube
        run: ./gradlew test --no-daemon --stacktrace

      - name: Prepare release keystore
        shell: bash
        env:
          AFUTUBE_KEYSTORE_B64: ${{ secrets.AFUTUBE_KEYSTORE_B64 }}
        run: echo "$AFUTUBE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/afutube-release.jks"

      - name: Build signed universal release APK
        working-directory: ./AfuTube
        env:
          AFUTUBE_KEYSTORE_PATH: ${{ runner.temp }}/afutube-release.jks
          AFUTUBE_KEYSTORE_PASS: ${{ secrets.AFUTUBE_KEYSTORE_PASS }}
          AFUTUBE_KEY_ALIAS: ${{ secrets.AFUTUBE_KEY_ALIAS }}
          AFUTUBE_KEY_PASS: ${{ secrets.AFUTUBE_KEY_PASS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }} -PversionName=0.0.${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: AfuTube-Release-APK
          path: AfuTube/app/build/outputs/apk/release/*universal*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-logs
          path: |
            AfuTube/app/build/reports/
            AfuTube/build/reports/
          retention-days: 7
