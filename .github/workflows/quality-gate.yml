name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  extension-tests:
    name: extension-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Surum araclari ve arayuz sozlesmeleri
        run: |
          python -m pip install --quiet pytest pyyaml
          python -B -m pytest tests -q
      - name: Uzanti cevrimdisi testleri
        shell: pwsh
        run: |
          foreach ($t in @("tests/extension_download_handoff_test.mjs", "tests/extension_ikinci_yol_test.mjs", "tests/extension_pending_message_test.mjs", "tests/extension_preflight_test.mjs", "tests/maestro_test.mjs")) {
            node $t
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  android-build:
    name: android-build
    uses: ./.github/workflows/android-debug.yml

  security:
    name: security
    uses: ./.github/workflows/security.yml

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs:
      - rust
      - extension-tests
      - android-build
      - security
    runs-on: ubuntu-latest
    steps:
      - name: quality-gate PASS/FAIL
        shell: bash
        env:
          RUST: ${{ needs.rust.result }}
          EXTENSION_TESTS: ${{ needs.extension-tests.result }}
          ANDROID_BUILD: ${{ needs.android-build.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "rust=$RUST" \
            "android-build=$ANDROID_BUILD" \
            "security=$SECURITY" \
            "extension-tests=$EXTENSION_TESTS"; do
            echo "$result"
            if [[ "$result" != *=success ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "QUALITY GATE: FAIL"
            exit 1
          fi
          echo "QUALITY GATE: PASS"

  rust:
    name: Rust fmt, test, clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Sabit Rust arac zinciri
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.98.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: aria2c motorunu indir
        run: python scripts/aria2_indir.py
      - name: Rust kapilari (iki workspace)
        env:
          AFUDM_ARIA2_TEST_EXE: ${{ github.workspace }}/engine/aria2c.exe
        shell: pwsh
        run: |
          foreach ($manifest in @("rs/Cargo.toml", "rs/app/Cargo.toml")) {
            cargo fmt --manifest-path $manifest --all -- --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked --manifest-path $manifest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo clippy --locked --manifest-path $manifest --all-targets -- -D warnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
