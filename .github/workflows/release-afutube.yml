name: Release AfuTube

on:
  push:
    tags:
      - 'afutube-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Install Gradle and generate wrapper
        working-directory: ./AfuTube
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-9.6.0/bin:$PATH"
          gradle wrapper --gradle-version 9.6.0 --distribution-type bin
          chmod +x gradlew

      - name: Prepare signing keystore
        env:
          AFUTUBE_KEYSTORE_B64: ${{ secrets.AFUTUBE_KEYSTORE_B64 }}
        run: echo "$AFUTUBE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/afutube-release.jks"

      - name: Run unit tests and build signed universal APK
        working-directory: ./AfuTube
        env:
          AFUTUBE_KEYSTORE_PATH: ${{ runner.temp }}/afutube-release.jks
          AFUTUBE_KEYSTORE_PASS: ${{ secrets.AFUTUBE_KEYSTORE_PASS }}
          AFUTUBE_KEY_ALIAS: ${{ secrets.AFUTUBE_KEY_ALIAS }}
          AFUTUBE_KEY_PASS: ${{ secrets.AFUTUBE_KEY_PASS }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#afutube-v}"
          BASE_VERSION="${VERSION_NAME%%-*}"
          VERSION_CODE=$(echo "$BASE_VERSION" | awk -F. '{print ($1*1000000)+($2*1000)+$3}')
          ./gradlew test assembleRelease --no-daemon --stacktrace -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp AfuTube/app/build/outputs/apk/release/*universal*.apk release-assets/AfuTube-universal.apk
          sha256sum release-assets/AfuTube-universal.apk > release-assets/AfuTube-universal.apk.sha256
          cp AfuTube/app/build/outputs/apk/release/*arm64-v8a*.apk release-assets/AfuTube-arm64-v8a.apk
          (cd release-assets && sha256sum AfuTube-arm64-v8a.apk > AfuTube-arm64-v8a.apk.sha256)
          VERSION_NAME="${GITHUB_REF_NAME#afutube-v}"
          BASE_VERSION="${VERSION_NAME%%-*}"
          VERSION_CODE=$(echo "$BASE_VERSION" | awk -F. '{print ($1*1000000)+($2*1000)+$3}')
          SHA256=$(cut -d' ' -f1 release-assets/AfuTube-universal.apk.sha256)
          PRERELEASE=false
          if [[ "${GITHUB_REF_NAME#afutube-v}" == *-* ]]; then PRERELEASE=true; fi
          cat > release-assets/AfuTube-update.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "tag": "${GITHUB_REF_NAME}",
            "apk": "AfuTube-universal.apk",
            "sha256": "${SHA256}",
            "minSdk": 24,
            "changelog": "${GITHUB_REF_NAME}",
            "prerelease": ${PRERELEASE}
          }
          EOF

      - name: Prepare latest manifest release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view afutube-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create afutube-latest --repo "$GITHUB_REPOSITORY" --prerelease --title "AfuTube latest (update manifest)" --notes "Stable AfuTube update manifest."
          gh release delete-asset afutube-latest AfuTube-update.json --repo "$GITHUB_REPOSITORY" -y || true

      - name: Publish latest update manifest
        if: ${{ !contains(github.ref_name, '-') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: afutube-latest
          name: AfuTube latest (update manifest)
          make_latest: false
          prerelease: true
          files: release-assets/AfuTube-update.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false  # AfuDM masaustu surumu Latest kalsin
          prerelease: ${{ contains(github.ref_name, '-test') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          name: AfuTube ${{ github.ref_name }}
          body: |
            # AfuTube ${{ github.ref_name }}

            This release adds signed in-app updates for AfuTube. The universal APK is verified with SHA-256 before installation.

            ## Highlights
            - Signed universal APK with a stable release key.
            - In-app update check from GitHub Releases.
            - Turkish update errors and configurable daily startup checks.

            ## Install
            Most phones: download the smaller `AfuTube-arm64-v8a.apk`. Older 32-bit phones: `AfuTube-universal.apk`. Both install over the previous signed version without removing data. In-app updates pick the right file automatically.

            ---

            ## Türkçe
            Bu sürüm AfuTube için imzalı uygulama içi güncellemeleri ekler. Kurulumdan önce universal APK SHA-256 ile doğrulanır.

            ## Öne çıkanlar
            - Sabit release anahtarıyla imzalı universal APK.
            - GitHub Releases üzerinden uygulama içi güncelleme denetimi.
            - Türkçe hata mesajları ve ayarlanabilir günlük açılış denetimi.

            ## Kurulum
            Çoğu telefon: daha küçük `AfuTube-arm64-v8a.apk`. Eski 32-bit telefonlar: `AfuTube-universal.apk`. İkisi de önceki imzalı sürümün üstüne veriler silinmeden kurulur. Uygulama içi güncelleme doğru dosyayı kendisi seçer.
          files: |
            release-assets/AfuTube-universal.apk
            release-assets/AfuTube-universal.apk.sha256
            release-assets/AfuTube-arm64-v8a.apk
            release-assets/AfuTube-arm64-v8a.apk.sha256
            release-assets/AfuTube-update.json
